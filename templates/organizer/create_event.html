{% extends "base.html" %}
{% block title %}Create Event{% endblock %}
{% block content %}
<div class="container">
    <h1>➕ Create New Event</h1>
    <form method="POST" class="form-card" enctype="multipart/form-data">
        <div class="form-group">
            <label>Event Title</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="4" required></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Start Time</label>
                <input type="time" name="start_time" class="form-control" required>
            </div>
            <div class="form-group">
                <label>End Time</label>
                <input type="time" name="end_time" class="form-control" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Mode</label>
                <select name="mode" id="event-mode" class="form-control" required>
                    <option value="offline">Offline (In-person)</option>
                    <option value="online">Online (Virtual)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Department</label>
                <select name="dept_id" id="dept-select" class="form-control" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.dept_id }}">{{ dept.dept_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Event Poster</label>
                <input type="file" name="poster" class="form-control" accept="image/*">
            </div>
            <div class="form-group" id="venue-select">
                <label>Venue</label>
                <select name="venue_id" id="venue-select-input" class="form-control">
                    <option value="">Select Venue</option>
                    {% for venue in venues %}
                    <option value="{{ venue.venue_id }}" data-dept="{{ venue.dept_id if venue.dept_id else 'common' }}">{{ venue.venue_name }} (Capacity: {{ venue.capacity }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" id="meeting-url" style="display:none;">
                <label>Meeting URL</label>
                <input type="url" name="meeting_url" class="form-control" placeholder="https://zoom.us/...">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Create Event</button>
        <a href="{{ url_for('organizer.dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
